name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build LiveSubTranslate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download Sherpa-ONNX Android AAR & Compile Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: |
          cp app/build/outputs/apk/release/app-release.apk LiveSubTranslate-v1.0.0.apk
          ls -lh LiveSubTranslate-v1.0.0.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveSubTranslate-Android-APK
          path: LiveSubTranslate-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiveSubTranslate-v1.0.0.apk
          generate_release_notes: true
